  <text x="120" y="150" font-size="30" font-style="italic" fill="#2b2619">Fig. 3 — Navigation, for commerce</text>
  <text x="120" y="185" font-size="19" fill="#6e675a" font-family="monospace" letter-spacing="3">ATLAS COMMERCE · PLATE III</text>
  <text x="1060" y="780" font-size="17" text-anchor="end" fill="#6e675a" font-style="italic">one catalogue, every channel</text>
