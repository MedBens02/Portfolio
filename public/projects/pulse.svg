<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50" shape-rendering="crispEdges">
  <rect width="80" height="50" fill="#262b45"/>
  <!-- window chrome -->
  <rect x="6" y="3" width="68" height="6" fill="#343b5c"/>
  <rect x="9" y="5" width="2" height="2" fill="#ff7d6b"/>
  <rect x="13" y="5" width="2" height="2" fill="#ffb454"/>
  <rect x="17" y="5" width="2" height="2" fill="#7ee8a2"/>
  <rect x="30" y="5" width="20" height="2" fill="#adb4d2"/>
  <rect x="6" y="9" width="68" height="32" fill="#1d2138"/>
  <!-- incoming bubble -->
  <rect x="10" y="13" width="5" height="5" fill="#4a5178"/>
  <rect x="17" y="12" width="26" height="8" fill="#343b5c"/>
  <rect x="19" y="14" width="20" height="1" fill="#adb4d2"/>
  <rect x="19" y="16" width="14" height="1" fill="#adb4d2"/>
  <rect x="17" y="21" width="10" height="2" fill="#4a5178"/>
  <!-- outgoing bubble -->
  <rect x="37" y="25" width="28" height="8" fill="#ffb454"/>
  <rect x="39" y="27" width="22" height="1" fill="#262b45"/>
  <rect x="39" y="29" width="15" height="1" fill="#262b45"/>
  <rect x="67" y="26" width="5" height="5" fill="#7ee8a2"/>
  <!-- typing indicator -->
  <rect x="10" y="35" width="3" height="3" fill="#7ee8a2"/>
  <rect x="15" y="35" width="3" height="3" fill="#4a5178"/>
  <rect x="20" y="35" width="3" height="3" fill="#4a5178"/>
  <!-- input bar -->
  <rect x="6" y="41" width="68" height="6" fill="#343b5c"/>
  <rect x="9" y="43" width="30" height="2" fill="#4a5178"/>
  <rect x="66" y="42" width="6" height="4" fill="#7ee8a2"/>
</svg>
