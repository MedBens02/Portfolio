  <circle cx="985" cy="160" r="7" fill="#c93a14" stroke="none"/>
  <text x="140" y="150" font-size="30" font-style="italic" fill="#2b2619">Fig. 1 — Telemetry, rendered legible</text>
  <text x="140" y="185" font-size="19" fill="#6e675a" font-family="monospace" letter-spacing="3">NEXA ANALYTICS · PLATE I</text>
  <text x="1060" y="780" font-size="17" text-anchor="end" fill="#6e675a" font-style="italic">drawn to scale, more or less</text>
</svg>
