<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="nx-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#2b2619" stroke-width="1" opacity="0.55"/>
    </pattern>
    <pattern id="nx-hatch2" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#2b2619" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#f0ebdf"/>
  <rect x="60" y="60" width="1080" height="780" fill="none" stroke="#2b2619" stroke-width="2"/>
  <rect x="72" y="72" width="1056" height="756" fill="none" stroke="#2b2619" stroke-width="0.75"/>
  <g stroke="#9b937e" stroke-width="0.8">
    <line x1="140" y1="700" x2="1060" y2="700"/>
    <line x1="140" y1="580" x2="1060" y2="580" stroke-dasharray="2 7"/>
    <line x1="140" y1="460" x2="1060" y2="460" stroke-dasharray="2 7"/>
    <line x1="140" y1="340" x2="1060" y2="340" stroke-dasharray="2 7"/>
    <line x1="140" y1="220" x2="1060" y2="220" stroke-dasharray="2 7"/>
  </g>
  <g stroke="#2b2619" stroke-width="1.5">
    <rect x="190" y="600" width="90" height="100" fill="url(#nx-hatch2)"/>
    <rect x="340" y="520" width="90" height="180" fill="url(#nx-hatch2)"/>
    <rect x="490" y="430" width="90" height="270" fill="url(#nx-hatch)"/>
    <rect x="640" y="330" width="90" height="370" fill="url(#nx-hatch)"/>
    <rect x="790" y="240" width="90" height="460" fill="#c93a14" fill-opacity="0.85"/>
  </g>
  <polyline points="235,560 385,480 535,395 685,290 835,200 985,160" fill="none" stroke="#2b2619" stroke-width="2"/>
  <g fill="#f0ebdf" stroke="#2b2619" stroke-width="1.5">
    <circle cx="235" cy="560" r="6"/><circle cx="385" cy="480" r="6"/><circle cx="535" cy="395" r="6"/>
    <circle cx="685" cy="290" r="6"/><circle cx="835" cy="200" r="6"/>
